  tip.textContent=pub(it)?"“"+it.t+"” — "+(it.n||T[lang].anon):(it.m==="let"?T[lang].letTip:T[lang].privTip);
  tip.style.display="block";clearTimeout(showTip.h);showTip.h=setTimeout(function(){tip.style.display="none"},4500);
}

function buildK(){
  var g=$("kgrid");g.innerHTML="";
  for(var i=0;i<4;i++){(function(i){
    var b=document.createElement("button");b.type="button";b.className="kopt"+(i===sel?" sel":"");
    b.innerHTML=svg(i)+'<div>'+T[lang].names[i]+'</div>';
    b.addEventListener("click",function(){sel=i;buildK()});
    g.appendChild(b);

}

  $("t_title").textContent=t.title;$("t_sub").textContent=t.sub;$("t_s1").textContent=t.s1;$("t_s2").textContent=t.s2;
  $("mWish").textContent=t.wish;$("mLet").textContent=t.let;$("name").placeholder=t.name;$("t_show").textContent=t.show;$("t_wall").textContent=t.wall;
  $("float").textContent=t.go;$("t_river").textContent=t.river;$("dl").textContent=t.dl;$("clr").textContent=t.clr;

}
function updateMode(){

  $("name").style.display=(mode==="wish"&&$("showWish").checked)?"block":"none";

function newFact(){var f=T[lang].facts;$("fact").textContent=f[Math.floor(Math.random()*f.length)];}

$("lTH").onclick=function(){setLang("th")};$("lEN").onclick=function(){setLang("en")};

$("float").onclick=function(){
  var txt=$("wish").value.trim();
  if(!txt){toast(T[lang].empty);return;}
  var show=mode==="wish"&&$("showWish").checked;
  var it={id:uid(),t:show?txt:"",n:show?$("name").value.trim():"",k:sel,m:mode,show:show};
  last={t:txt,n:it.n,k:sel,m:mode};
  if(SHARED){
    fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(it)})
      .then(function(r){if(!r.ok)throw 0;return pull()}).catch(function(){toast(lang==="th"?"ส่งไม่สำเร็จ ลองอีกครั้ง":"Could not send, please retry")});
    items.push(it);render();
  }else{
    items.push(it);if(items.length>40)items.shift();
    save(items);render();
  }
  newFact();
  $("wish").value="";$("c").textContent="0";
  toast(T[lang].sent);
  $("river").scrollIntoView({behavior:"smooth",block:"center"});
};
$("clr").onclick=function(){
  if(SHARED){
    fetch(API+"?key="+encodeURIComponent(ADMIN),{method:"DELETE"}).then(function(r){if(!r.ok)throw 0;items=[];sig="";return pull()}).then(function(){toast(T[lang].cleared)}).catch(function(){toast("Admin key invalid")});
    return;
  }
  items=[];save(items);render();toast(T[lang].cleared);
};

function wrap(ctx,text,x,y,maxW,lh){
  var chars=Array.from(text),line="",lines=[];
  chars.forEach(function(ch){var test=line+ch;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=ch}else line=test});
  lines.push(line);
  lines.slice(0,8).forEach(function(l,i){ctx.fillText(l,x,y+i*lh)});
  return lines.length;
}
$("dl").onclick=function(){
  if(!last){toast(T[lang].noCard);return;}
  var cv=document.createElement("canvas");cv.width=800;cv.height=1000;var ctx=cv.getContext("2d");
  var g=ctx.createLinearGradient(0,0,0,1000);g.addColorStop(0,"#050818");g.addColorStop(.6,"#0d1745");g.addColorStop(1,"#16336b");
  ctx.fillStyle=g;ctx.fillRect(0,0,800,1000);
  for(var i=0;i<80;i++){ctx.fillStyle="rgba(255,255,255,"+Math.random()+")";ctx.fillRect(Math.random()*800,Math.random()*500,2,2);}
  ctx.textAlign="center";ctx.fillStyle="#ffd27a";ctx.font="bold 44px 'Segoe UI','Noto Sans Thai',sans-serif";
  ctx.fillText("Arup Bangkok • Loy Krathong 2026",400,100);
  ctx.font="28px 'Segoe UI','Noto Sans Thai',sans-serif";ctx.fillStyle="#fff";
  var title=last.m==="wish"?"✨ Make a Wish":"🕊️ Let It Go";ctx.fillText(title,400,160);
  var img=new Image();

    ctx.drawImage(img,250,230,300,300);

    }else{
      ctx.fillText(lang==="th"?"ปล่อยวางไปกับสายน้ำแล้ว":"Let go, and flow with the water",400,640);
    }
    var a=document.createElement("a");a.download="loy-krathong-card.png";a.href=cv.toDataURL("image/png");a.click();
  };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg(last.k).replace('<svg ','<svg width="300" height="300" '));
};

function lanterns(){
  var box=$("lanterns"),h="",i,n=window.innerWidth<600?7:12;
  for(i=0;i<n;i++){
    var sz=.6+Math.random()*.9,dur=22+Math.random()*22,del=-Math.random()*dur,sd=3+Math.random()*3;
    h+='<div class="lan" style="left:'+(Math.random()*96)+'%;transform-origin:center;animation-duration:'+dur+'s;animation-delay:'+del+'s;scale:'+sz+'"><div class="sw" style="animation-duration:'+sd+'s"><div class="bd"></div></div></div>';
  }
  box.innerHTML=h;
}
function fireworks(){
  var cv=$("fw"),ctx=cv.getContext("2d"),W,H,dpr=Math.min(window.devicePixelRatio||1,2),parts=[],rockets=[],next=0;
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  function size(){W=window.innerWidth;H=window.innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  size();window.addEventListener("resize",size);
  var PAL=[[255,210,122],[255,120,150],[130,200,255],[190,150,255],[140,255,190],[255,255,255],[255,160,60]];
  function burst(x,y){
    var c=PAL[Math.floor(Math.random()*PAL.length)],c2=PAL[Math.floor(Math.random()*PAL.length)],n=46+Math.floor(Math.random()*22),sp=2.2+Math.random()*2.2,ring=Math.random()<.35;
    for(var i=0;i<n;i++){
      var a=Math.PI*2*i/n+(ring?0:Math.random()*.3),v=ring?sp:sp*(.3+Math.random()*.9);
      parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,dec:.009+Math.random()*.008,c:Math.random()<.7?c:c2});
    }
  }
  function frame(t){
    ctx.globalCompositeOperation="destination-out";ctx.fillStyle="rgba(0,0,0,.22)";ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    if(t>next&&rockets.length<3){
      rockets.push({x:W*(.1+Math.random()*.8),y:H+10,ty:H*(.1+Math.random()*.35),vy:-(7+Math.random()*3)});
      next=t+900+Math.random()*1800;
    }
    rockets=rockets.filter(function(r){
      r.y+=r.vy;r.vy*=.985;
      ctx.fillStyle="rgba(255,230,170,.9)";ctx.fillRect(r.x,r.y,2,6);
      if(r.y<=r.ty||r.vy>-1.6){burst(r.x,r.y);return false;}
      return true;
    });
    if(parts.length>700)parts.splice(0,parts.length-700);
    parts=parts.filter(function(p){
      p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.035;p.life-=p.dec;
      if(p.life<=0)return false;
      ctx.fillStyle="rgba("+p.c[0]+","+p.c[1]+","+p.c[2]+","+p.life.toFixed(2)+")";
      ctx.beginPath();ctx.arc(p.x,p.y,1.6*p.life+.6,0,6.283);ctx.fill();
      return true;
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
stars();lanterns();fireworks();setLang("th");
