function load(){try{return JSON.parse(localStorage.getItem("lk_river")||"null")}catch(e){return null}}

function sigOf(a){return a.length+":"+(a.length?a[a.length-1].id||"":"");}
function pull(first){
  return fetch(API,{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    var was=SHARED;SHARED=true;probed=true;

var nodes={},firstRender=true,uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};

      b=document.createElement("button");b.type="button";b.className="k"+(firstRender?"":" fresh");

function pub(it){return it.m==="wish"&&it.show!==false&&!!it.t;}

      admSet(st===403?T[lang].admBad:st===503?T[lang].admNoKey:T[lang].admErr);}
    admUI();return st;
  });
}

function wrap(ctx,text,x,y,maxW,lh){
  var chars=Array.from(text),line="",lines=[];
  chars.forEach(function(ch){var test=line+ch;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=ch}else line=test});
  lines.push(line);
  lines.slice(0,8).forEach(function(l,i){ctx.fillText(l,x,y+i*lh)});
  return lines.length;
}

function fireworks(){
  var cv=$("fw"),ctx=cv.getContext("2d"),W,H,dpr=Math.min(window.devicePixelRatio||1,2),parts=[],rockets=[],next=0;
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  function size(){W=window.innerWidth;H=window.innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  size();window.addEventListener("resize",size);
  var PAL=[[255,210,122],[255,120,150],[130,200,255],[190,150,255],[140,255,190],[255,255,255],[255,160,60]];
  function burst(x,y){
    var c=PAL[Math.floor(Math.random()*PAL.length)],c2=PAL[Math.floor(Math.random()*PAL.length)],n=46+Math.floor(Math.random()*22),sp=2.2+Math.random()*2.2,ring=Math.random()<.35;
    for(var i=0;i<n;i++){
      var a=Math.PI*2*i/n+(ring?0:Math.random()*.3),v=ring?sp:sp*(.3+Math.random()*.9);
      parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,dec:.009+Math.random()*.008,c:Math.random()<.7?c:c2});
    }
  }
  function frame(t){
    ctx.globalCompositeOperation="destination-out";ctx.fillStyle="rgba(0,0,0,.22)";ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    if(t>next&&rockets.length<3){
      rockets.push({x:W*(.1+Math.random()*.8),y:H+10,ty:H*(.1+Math.random()*.35),vy:-(7+Math.random()*3)});
      next=t+900+Math.random()*1800;
    }
    rockets=rockets.filter(function(r){
      r.y+=r.vy;r.vy*=.985;
      ctx.fillStyle="rgba(255,230,170,.9)";ctx.fillRect(r.x,r.y,2,6);
      if(r.y<=r.ty||r.vy>-1.6){burst(r.x,r.y);return false;}
      return true;
    });
    if(parts.length>700)parts.splice(0,parts.length-700);
    parts=parts.filter(function(p){
      p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.035;p.life-=p.dec;
      if(p.life<=0)return false;
      ctx.fillStyle="rgba("+p.c[0]+","+p.c[1]+","+p.c[2]+","+p.life.toFixed(2)+")";
      ctx.beginPath();ctx.arc(p.x,p.y,1.6*p.life+.6,0,6.283);ctx.fill();
      return true;
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
